spring.application.name=API

# Render inyecta PORT. En local sigue siendo 8080.
server.port=${PORT:8080}

# Carga las variables del archivo .env (formato properties) si existe
spring.config.import=optional:file:.env[.properties]

# Base de datos (valores reales en el archivo .env, ver .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (el schema lo administra Neon; la API no crea tablas)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Auth0 (Resource Server: la API valida JWT emitidos por Auth0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://CHANGE-ME.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.sodablush.com}

# CORS (origenes permitidos, separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://soda-blush.vercel.app}
